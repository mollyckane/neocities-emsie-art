<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>emsie's letterpress</title>
    <link rel="icon" href="/images/star-favicon.svg">
    <link rel="stylesheet" href="../style.css">
    <script src="../javascript/letterpress.js" defer></script>
</head>
<body>
    <header class="header">
        <a href="../index.html">
            <img src="../images/star-favicon.svg" alt="Star Icon" class="header-icon">
        </a>
    </header>
    <main class="desktop letterpress">
        <div class="letterpress-flex">
            <img src="/images/letterpress/A@2x.png" data-letter="A">
            <img src="/images/letterpress/B@2x.png" data-letter="B">
            <img src="/images/letterpress/C@2x.png" data-letter="C">
            <img src="/images/letterpress/D@2x.png" data-letter="D">
            <img src="/images/letterpress/E@2x.png" data-letter="E">
            <img src="/images/letterpress/F@2x.png" data-letter="F">
            <img src="/images/letterpress/G@2x.png" data-letter="G">
            <img src="/images/letterpress/H@2x.png" data-letter="H">
            <img src="/images/letterpress/I@2x.png" data-letter="I">
            <img src="/images/letterpress/J@2x.png" data-letter="J">
            <img src="/images/letterpress/K@2x.png" data-letter="K">
            <img src="/images/letterpress/L@2x.png" data-letter="L">
            <img src="/images/letterpress/M@2x.png" data-letter="M">
            <img src="/images/letterpress/N@2x.png" data-letter="N">
            <img src="/images/letterpress/O@2x.png" data-letter="O">
            <img src="/images/letterpress/P@2x.png" data-letter="P">
            <img src="/images/letterpress/Q@2x.png" data-letter="Q">
            <img src="/images/letterpress/R@2x.png" data-letter="R">
            <img src="/images/letterpress/S@2x.png" data-letter="S">
            <img src="/images/letterpress/T@2x.png" data-letter="T">
            <img src="/images/letterpress/U@2x.png" data-letter="U">
            <img src="/images/letterpress/V@2x.png" data-letter="V">
            <img src="/images/letterpress/W@2x.png" data-letter="W">
            <img src="/images/letterpress/X@2x.png" data-letter="X">
            <img src="/images/letterpress/Y@2x.png" data-letter="Y">
            <img src="/images/letterpress/Z@2x.png" data-letter="Z">
            <img src="/images/letterpress/dot@2x.png" data-letter=".">
            <img src="/images/letterpress/!@2x.png" data-letter="!">
        </div>
        <div class="print-strip">
            <div class="limit-bubble" id="limitBubble">character limit reached!</div>
            <div class="printed-text" id="output"></div>
            <div class="press-controls" id="controls">
                <button class="clear-btn tooltip" id="clear">
                    <img src="../images/letterpress/clear@2x.png" alt="Clear">
                    <span class="tooltip-text">Clear</span>
                </button>
                <button class="space-btn tooltip" id="spacebar">
                    <img src="../images/letterpress/space@2x.png" alt="Space">
                    <span class="tooltip-text">Space</span>
                </button>
                <button class="backspace-btn tooltip" id="backspace">
                    <img src="../images/letterpress/backspace@2x.png" alt="Backspace">
                    <span class="tooltip-text">Backspace</span>
                </button>
                
            </div>  
        </div>
    </main>
</body>

</html>
